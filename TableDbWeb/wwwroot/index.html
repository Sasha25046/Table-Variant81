<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Таблична СКБД — Веб-версія (Варіант 81)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top-nav">
    <span class="brand">Таблична СКБД — Варіант 81 (Веб)</span>
    <button onclick="newDatabasePrompt()">Нова БД</button>
    <button onclick="exportDatabase()">Зберегти JSON</button>
    <input type="file" id="fileInput" accept=".json,application/json" style="display:none" onchange="importDatabase(event)">
    <button onclick="if(window.showOpenFilePicker){ importDatabase(); } else { document.getElementById('fileInput').click(); }">Завантажити JSON</button>
  </div>

  <div class="app-layout">
    <aside class="sidebar">
      <h3>Таблиці в базі:</h3>
      <div id="tableList" class="table-list"></div>
      <div class="sidebar-actions">
        <button onclick="openCreateTableModal()">+ Створити таблицю</button>
        <button onclick="deleteCurrentTable()" class="btn-danger">- Видалити таблицю</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="toolbar">
        <div class="btn-group">
          <button onclick="openAddColumnModal()">+ Додати колонку</button>
          <button onclick="openEditColumnModal()">✎ Редагувати колонку</button>
          <button onclick="deleteColumnAction()">- Видалити колонку</button>
        </div>
        <div class="btn-group">
          <button onclick="openRowModal(false)">+ Додати рядок</button>
          <button onclick="openRowModal(true)">✎ Редагувати рядок</button>
          <button onclick="deleteRowAction()">- Видалити рядок</button>
        </div>
      </div>

      <div class="search-panel">
        <label>Пошук за шаблоном:</label>
        <span>Колонка:</span>
        <select id="searchColumnSelect"></select>
        <span>Шаблон:</span>
        <input type="text" id="searchPatternInput" placeholder="напр. *+4i або ?+4i">
        <button onclick="performSearch()">Пошук</button>
        <button onclick="resetSearch()">Скинути</button>
      </div>

      <div class="table-container">
        <table id="dataTable">
          <thead id="dataThead"></thead>
          <tbody id="dataTbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal" id="modalContainer"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
